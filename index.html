<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px;font-family:Arial,sans-serif;
  background:linear-gradient(145deg,#17131a,#241b27);color:#fff
}
.card{
  width:100%;max-width:420px;padding:32px 22px 28px;text-align:center;
  border:1px solid rgba(255,102,196,.45);border-radius:28px;
  background:rgba(255,255,255,.035);
  box-shadow:0 25px 70px rgba(0,0,0,.5)
}
.logo{width:min(90%,330px);max-height:145px;object-fit:contain;margin-bottom:25px}
.name{font-size:27px;font-weight:700;margin:0 0 7px}
.designation{

  letter-spacing:2px;text-transform:uppercase;margin-bottom:24px
}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.btn{
  min-height:58px;border-radius:17px;text-decoration:none;color:#fff;
  display:flex;align-items:center;justify-content:center;gap:9px;
  font-weight:700;font-size:15px;border:1px solid rgba(255,255,255,.12);
  transition:.18s
}
.btn:hover{transform:translateY(-2px);filter:brightness(1.06)}
.btn:active{transform:scale(.98)}
.call{background:linear-gradient(135deg,#ff66c4,#d94ba5)}
.whatsapp{background:linear-gradient(135deg,#e2a9f1,#bd78d5)}
.email{background:rgba(226,169,241,.16);border-color:rgba(226,169,241,.35)}
.website{background:rgba(255,102,196,.13);border-color:rgba(255,102,196,.38)}
.icon{font-size:19px}
@media(max-width:360px){.buttons{grid-template-columns:1fr}.name{font-size:24px}}
</style>
